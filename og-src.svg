<text x="350" y="208" font-family="JetBrains Mono" font-weight="bold" font-size="62" fill="#e8e8ea">HasanAbi Chat Thing</text>
<text x="350" y="278" font-family="JetBrains Mono" font-size="28" fill="#9a9aa5">a compact, customisable, one-page Twitch chat</text>
<text x="350" y="316" font-family="JetBrains Mono" font-size="28" fill="#9a9aa5">client, orientated around the <tspan fill="#e8e8ea">Hasan Piker</tspan></text>
<text x="350" y="354" font-family="JetBrains Mono" font-size="28" fill="#9a9aa5">stream, aka the <tspan fill="#e8e8ea">Piker Broadcasting Service</tspan> (<tspan fill="#e8e8ea">PBS</tspan>);</text>
<text x="350" y="392" font-family="JetBrains Mono" font-size="28" fill="#9a9aa5">a second-screen/accessibility web tool with</text>
<text x="350" y="430" font-family="JetBrains Mono" font-size="28" fill="#9a9aa5">organizing info, media links, and other extras</text>
<text x="350" y="486" font-family="JetBrains Mono" font-size="27" fill="#6a6a75" xml:space="preserve"><tspan fill="#e8a33d">hasanabi.neocities.org</tspan><tspan fill="#a9a9b4"> for </tspan><tspan fill="#b9a5f0">twitch.tv/hasanabi</tspan></text>
